<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
</head>

<body>
    <h1>Hello {{ username }}!</h1>

    <p>Here are the latest AI news:</p>

    {% for news in news_list %}
        <div>
            <h2>{{ news.title }}</h2>
            <p>{{ news.description }}</p>
            <a href="{{ news.url }}">Read More</a>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
