{% extends "base/base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}">

<section class="forgot-section">

    <div class="forgot-card">

        <div class="forgot-icon">
            <img src="{{ url_for('static', filename='images/forgot-password.svg') }}" alt="Forgot Password">
        </div>

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Enter your registered email address below. We'll send you a One-Time
            Password (OTP) to securely reset your account password.
        </p>

        <form action="{{ url_for('auth.forgot_password_route') }}" method="POST">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input type="email" id="email" name="email" placeholder="Enter your registered email" required>

            </div>

            <button type="submit" class="login-btn">
                <i class="bi bi-send-fill"></i>
                Send OTP
            </button>

        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <a href="{{ url_for('auth.login') }}" class="back-link">
            <img src="{{ url_for('static', filename='images/arrow-left.svg') }}" alt="Back">
            Back to Login
        </a>

    </div>

</section>

{% endblock %}
