{% extends "base/base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset-password.css') }}">

<section class="reset-section">

    <div class="reset-card">

        <div class="reset-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h1>Create New Password</h1>

        <p class="subtitle">
            Your new password must be different from your previous password.
        </p>

        <form action="/auth/reset-password" method="POST" id="resetForm">

            <!-- New Password -->
            <div class="input-group">

                <label for="password">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="pw"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <small class="hint">
                    Minimum 8 characters
                </small>

            </div>

            <!-- Confirm Password -->
            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="cpw"
                        placeholder="Confirm password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                    >
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <small id="matchText"></small>

            </div>

            <button class="reset-btn" type="submit">
                <i class="bi bi-check-circle-fill"></i>
                Reset Password
            </button>

        </form>

        <div class="footer-link">

            <a href="{{ url_for('auth.login' ) }}">
                <i class="bi bi-arrow-left"></i>
                Back to Login
            </a>

        </div>

    </div>

</section>

<script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>

{% endblock %}
